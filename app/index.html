<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening Finder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";

      // Streamlit runs in the browser on Pyodide; these files are fetched from this Space.
      const files = [
        "streamlit_app.py",
        "finder.py",
        "data/best_openings.parquet",
        "data/blunders.parquet",
        "data/slices.parquet",
        "data/meta.json",
      ];
      mount(
        {
          requirements: ["pandas", "pyarrow"],
          entrypoint: "streamlit_app.py",
          streamlitConfig: { "client.toolbarMode": "viewer" },
          files: Object.fromEntries(files.map((f) => [f, { url: `./${f}` }])),
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>

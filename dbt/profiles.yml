# Run from the repo root: uv run dbt build --project-dir dbt --profiles-dir dbt
# Paths are relative to the working directory, which is the repo root locally and
# /opt/lichess in the Airflow image; both have data/ next to them.
opening_finder:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('LICHESS_DATA_DIR', 'data') }}/gold/gold.duckdb"
      threads: 4

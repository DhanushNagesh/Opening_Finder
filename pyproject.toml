[project]
name = "lichess"
version = "0.1.0"
description = "Lichess PGN dumps to Parquet, silver and gold tables for an opening finder"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyarrow==26.0.1",
    "zstandard==0.25.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "chess==1.11.2",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
